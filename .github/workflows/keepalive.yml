# Mantiene despierto el proyecto de Supabase (plan gratuito: se pausa tras
# 7 días sin actividad de API). Hace UNA consulta de solo lectura por día.
# No escribe nada, no toca movimientos ni stock.
#
# Requiere dos "secrets" en el repositorio
# (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       = valor de VITE_SUPABASE_URL
#   SUPABASE_ANON_KEY  = valor de VITE_SUPABASE_ANON_KEY  (clave pública)

name: Keep Supabase alive

on:
  schedule:
    - cron: "17 6 * * *" # todos los días a las 06:17 UTC
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima de solo lectura
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Faltan los secrets SUPABASE_URL / SUPABASE_ANON_KEY en el repositorio."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/movements?select=id&limit=1")
          echo "Respuesta HTTP: $code"
          if [ "$code" != "200" ]; then
            echo "El ping a Supabase no respondió 200. Revisa el proyecto."
            exit 1
          fi
          echo "Supabase respondió OK — proyecto activo."
